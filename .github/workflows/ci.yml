name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: 后端测试（pytest）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: hhlg_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      # 测试库指向 CI 里的 MySQL 服务；Redis 由 conftest 指向不可达端口自动降级
      TEST_DATABASE_URL: mysql+pymysql://root:root123456@127.0.0.1:3306/hhlg_test?charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: 安装依赖
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: 运行测试
        working-directory: backend
        run: python -m pytest tests -q

  frontend:
    name: 前端测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-vue/package-lock.json

      - name: 安装依赖
        working-directory: frontend-vue
        run: npm ci

      - name: 单元测试
        working-directory: frontend-vue
        run: npm run test

      - name: 类型检查与构建
        working-directory: frontend-vue
        run: npm run build
