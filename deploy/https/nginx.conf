# 前端 Nginx（HTTPS 可选部署）
# 用法：docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
# 证书：deploy/https/certs/server.crt + server.key（挂载到 /etc/nginx/certs）

# HTTP：仅保留健康检查，其余跳转 HTTPS
server {
    listen 80;
    server_name _;

    # 容器健康检查走这里，避免跳转后自签证书校验失败
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：确认全站 HTTPS 后再启用（自签/内网可先注释）
    # add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/wasm model/gltf-binary image/svg+xml;

    # ---------- 静态资源 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /models/ {
        types {
            model/gltf-binary glb;
            application/json gltf;
        }
        default_type application/octet-stream;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Docker 内置 DNS：后端容器重建后 IP 会变化，用变量代理可避免缓存旧地址
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream "backend:8000";

    # ---------- 后端 API ----------
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- WebSocket（前端自动切换 wss://） ----------
    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- SPA 路由回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
