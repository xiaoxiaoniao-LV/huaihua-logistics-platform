# Prometheus 抓取配置样例
# 用法：prometheus --config.file=deploy/prometheus/prometheus.yml
# 若后端配置了 METRICS_TOKEN，需在 authorization.credentials 填入同一令牌。
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: hhlg-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]   # 容器内直连；宿主机调试可改为 host.docker.internal:8010
    # authorization:
    #   type: Bearer
    #   credentials: "<METRICS_TOKEN>"
