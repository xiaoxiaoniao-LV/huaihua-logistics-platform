# 怀化国际陆港冷链资源智能撮合平台（港区规模虚拟 + 实验室硬件原型） —— 生产栈
#
# 启动：docker compose up -d --build
# 带模拟设备数据：docker compose --profile demo up -d --build
# 停止：docker compose down
# 数据保留：MySQL 数据在命名卷 mysql_data 中，down 不会删除
#
# 宿主机端口可通过根目录 .env 覆盖，默认值已避开本机其他项目的占用：
#   HHLG_WEB_PORT=8080   前端（Nginx）
#   HHLG_DEMAND_PORT=8081 需求端 uni-app H5（Nginx）
#   HHLG_API_PORT=8010   后端直连（调试用）
#   HHLG_MYSQL_PORT=3307 MySQL
#   HHLG_MQTT_PORT=1884  MQTT（设备接入）
#   HHLG_EMQX_DASH_PORT=18084  EMQX 控制台

# 统一日志轮转，避免长跑后 json-file 撑满磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    container_name: hhlg-mysql
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: huaihua_logistics
      MYSQL_USER: ${MYSQL_USER:-logistics}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-logistics123}
      TZ: Asia/Shanghai
    ports:
      - "${HHLG_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: hhlg-redis
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  emqx:
    image: emqx/emqx:5.7
    container_name: hhlg-emqx
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    environment:
      EMQX_NODE__NAME: emqx@127.0.0.1
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASH_PASSWORD:-public123}
      TZ: Asia/Shanghai
    ports:
      - "${HHLG_MQTT_PORT:-1884}:1883"
      - "${HHLG_EMQX_DASH_PORT:-18084}:18083"
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx", "ctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
    # CI/CD 时注入 GHCR 镜像名，本地留空即使用本地构建
    image: ${HHLG_BACKEND_IMAGE:-hhlg-backend:latest}
    container_name: hhlg-backend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-logistics}:${MYSQL_PASSWORD:-logistics123}@mysql:3306/huaihua_logistics?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      MQTT_HOST: emqx
      MQTT_PORT: "1883"
      JWT_SECRET: ${JWT_SECRET:?请在根目录 .env 中设置 JWT_SECRET}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-900}
      CORS_ORIGINS: http://localhost:${HHLG_WEB_PORT:-8080},http://127.0.0.1:${HHLG_WEB_PORT:-8080}
      DEVICE_INGEST_TOKEN: ${DEVICE_INGEST_TOKEN:-}
      DEVICE_OFFLINE_SECONDS: ${DEVICE_OFFLINE_SECONDS:-90}
      # 文件级 OTA：固件发布包只读挂载到容器内，设备按 manifest 拉取
      FW_REPO_DIR: /app/fw/releases
      # 固件清单 Ed25519 验签：只放公钥；生产默认 OTA_REQUIRE_SIGNATURE=true
      OTA_PUBLIC_KEY: ${OTA_PUBLIC_KEY:-}
      OTA_REQUIRE_SIGNATURE: ${OTA_REQUIRE_SIGNATURE:-true}
      ALERT_TEMP_MIN: ${ALERT_TEMP_MIN:--30}
      ALERT_TEMP_MAX: ${ALERT_TEMP_MAX:--5}
      ALERT_HUMIDITY_MAX: ${ALERT_HUMIDITY_MAX:-90}
      # 交易：佣金率与支付模式（sandbox=本机模拟收银台，off=仅线下合同）
      COMMISSION_RATE: ${COMMISSION_RATE:-0.10}
      PAYMENT_MODE: ${PAYMENT_MODE:-sandbox}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      # 配置后异步通知强制 RSA2 验签（后台拷贝的公钥，裸 base64 或 PEM 均可）
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      ALIPAY_SELLER_ID: ${ALIPAY_SELLER_ID:-}
      # /metrics 抓取令牌，留空不鉴权
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TZ: Asia/Shanghai
    volumes:
      - ./iot/firmware:/app/fw:ro
    ports:
      - "${HHLG_API_PORT:-8010}:8000"

  frontend:
    build:
      context: ./frontend-vue
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ${HHLG_FRONTEND_IMAGE:-hhlg-frontend:latest}
    container_name: hhlg-frontend
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HHLG_WEB_PORT:-8080}:80"

  # 需求端（uni-app H5）：游客可浏览资源、下单与查订单
  demand:
    build:
      context: ./demand-app
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    image: ${HHLG_DEMAND_IMAGE:-hhlg-demand:latest}
    container_name: hhlg-demand
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HHLG_DEMAND_PORT:-8081}:80"

  # 可选：模拟 IoT 设备（无真实硬件时用于演示）
  simulator:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: iot/Dockerfile
    image: ${HHLG_SIMULATOR_IMAGE:-hhlg-simulator:latest}
    container_name: hhlg-simulator
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128m
    depends_on:
      backend:
        condition: service_healthy
    environment:
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      API_BASE: http://backend:8000
      DEVICE_TOKEN: ${DEVICE_INGEST_TOKEN:-}
      DEVICE_CODE: SIM-DEMO-01
      PUBLISH_INTERVAL: ${PUBLISH_INTERVAL:-5}
      INTERVAL: ${PUBLISH_INTERVAL:-5}
      TZ: Asia/Shanghai

volumes:
  mysql_data:
  redis_data:
  emqx_data:
